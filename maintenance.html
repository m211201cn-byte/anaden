<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>アナデンキャラ検索ツール</title>
  <meta name="description" content="アナザーエデンのキャラクター・属性・武器・スキルを条件指定で検索できる非公式データ検索ツールです。">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WDGXB57RZ4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WDGXB57RZ4');
  </script>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="site-title">アナデンキャラ検索ツール</div>
    <div class="top-links">
      <a href="./about.html">このサイトについて</a>
    </div>
  </div>
</header>

<section class="query-panel">
  <div class="query-inner">
    <div id="tokenContainer" class="token-container"></div>

    <div class="query-buttons">
      <button class="main-btn logic-btn" onclick="addOperator('AND')">AND</button>
      <button class="main-btn logic-btn" onclick="addOperator('OR')">OR</button>
      <button class="main-btn logic-btn" onclick="addOperator('(')">(</button>
      <button class="main-btn logic-btn" onclick="addOperator(')')">)</button>
      <button class="search-btn" onclick="executeSearch()">検索</button>
      <button class="danger-btn" onclick="clearTokens()">全消去</button>
    </div>
  </div>
</section>

<main class="main-layout">
  <section class="category-panel">

    <div class="category-box">
      <h2>基本</h2>

      <div class="button-subgroup">
        <div class="chip-group">
          <button class="chip" onclick="addFieldCondition('f5','NS','NS')">NS</button>
          <button class="chip" onclick="addFieldCondition('f5','AS','AS')">AS</button>
          <button class="chip" onclick="addFieldCondition('f5','ES','ES')">ES</button>
          <button class="chip" onclick="addFieldCondition('f8','男','男')">男</button>
          <button class="chip" onclick="addFieldCondition('f8','女','女')">女</button>
          <button class="chip" onclick="addFieldCondition('f8','不明','性別不明')">性別不明</button>
        </div>
      </div>

      <div class="button-subgroup">
        <div class="chip-group">
          <button class="chip" onclick="addFieldCondition('f6','y','異時層')">異時層</button>
          <button class="chip" onclick="addFieldCondition('f6','n','本時層')">本時層</button>
          <button class="chip" onclick="addFieldCondition('f7','y','星導覚醒')">星導覚醒</button>
          <button class="chip" onclick="addFieldCondition('f7','n','未覚醒')">未覚醒</button>
        </div>
      </div>

      <div class="button-subgroup">
        <div class="chip-group">
          <button class="chip" onclick="addContainsCondition('f9','火','火')">火</button>
          <button class="chip" onclick="addContainsCondition('f9','水','水')">水</button>
          <button class="chip" onclick="addContainsCondition('f9','風','風')">風</button>
          <button class="chip" onclick="addContainsCondition('f9','地','地')">地</button>
          <button class="chip" onclick="addContainsCondition('f9','雷','雷')">雷</button>
          <button class="chip" onclick="addContainsCondition('f9','晶','晶')">晶</button>
          <button class="chip" onclick="addContainsCondition('f9','陰','陰')">陰</button>
          <button class="chip" onclick="addContainsCondition('f9','無','無')">無</button>
        </div>
      </div>

      <div class="button-subgroup">
        <div class="chip-group">
          <button class="chip" onclick="addFieldCondition('f10','剣','剣')">剣</button>
          <button class="chip" onclick="addFieldCondition('f10','刀','刀')">刀</button>
          <button class="chip" onclick="addFieldCondition('f10','斧','斧')">斧</button>
          <button class="chip" onclick="addFieldCondition('f10','槍','槍')">槍</button>
          <button class="chip" onclick="addFieldCondition('f10','弓','弓')">弓</button>
          <button class="chip" onclick="addFieldCondition('f10','拳','拳')">拳</button>
          <button class="chip" onclick="addFieldCondition('f10','槌','槌')">槌</button>
          <button class="chip" onclick="addFieldCondition('f10','杖','杖')">杖</button>
        </div>
      </div>

      <div class="button-subgroup">
        <div class="chip-group">
          <button class="chip" onclick="addFieldCondition('f11','天','天')">天</button>
          <button class="chip" onclick="addFieldCondition('f11','冥','冥')">冥</button>
          <button class="chip" onclick="addFieldCondition('f12','配布','配布')">配布</button>
          <button class="chip" onclick="addFieldCondition('f12','夢見','夢見')">夢見</button>
        </div>
      </div>
    </div>

    <div class="category-box">
      <h2>パーソナリティ</h2>
      <input id="personalitySearch" class="compact-input" type="text" placeholder="入力して検索..." oninput="searchPersonality()">
      <div id="personalityResult" class="personality-result"></div>
      <div class="chip-group personality-common">
        <button class="chip" onclick="addContainsCondition('f13','ねこ好き','ねこ好き')">ねこ好き</button>
        <button class="chip" onclick="addContainsCondition('f13','東方','東方')">東方</button>
        <button class="chip" onclick="addContainsCondition('f13','西方','西方')">西方</button>
        <button class="chip" onclick="addContainsCondition('f13','KMS社','KMS社')">KMS社</button>
        <button class="chip" onclick="addContainsCondition('f13','IDAスクール','IDA')">IDA</button>
        <button class="chip" onclick="addContainsCondition('f13','ミグランス王宮','王宮')">王宮</button>
        <button class="chip" onclick="addContainsCondition('f13','聖職者','聖職者')">聖職者</button>
        <button class="chip" onclick="addContainsCondition('f13','復讐者','復讐者')">復讐者</button>
        <button class="chip" onclick="addContainsCondition('f13','甘党','甘党')">甘党</button>
        <button class="chip" onclick="addContainsCondition('f13','大食い','大食い')">大食い</button>
        <button class="chip" onclick="addContainsCondition('f13','フード','フード')">フード</button>
        <button class="chip" onclick="addContainsCondition('f13','メガネ','メガネ')">メガネ</button>
        <button class="chip" onclick="addContainsCondition('f13','採集','採集')">採集</button>
        <button class="chip" onclick="addContainsCondition('f13','採掘','採掘')">採掘</button>
      </div>
    </div>

    <div class="category-box">
      <h2>スキル</h2>
      <div id="skillButtons" class="skill-list"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div id="dataVersion">Data Ver -</div>
</footer>

<div id="skillModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalSkillTitle"></h2>
      <button class="close-btn" onclick="closeSkillModal()">×</button>
    </div>

    <div class="modal-section">
      <h3>スキル種類（OR）</h3>
      <label><input type="checkbox" data-bit="3"> ヴァリアブルチャント</label>
      <label><input type="checkbox" data-bit="4"> 固有スキル</label>
      <label><input type="checkbox" data-bit="5"> 星導スキル</label>
    </div>

    <div class="modal-section">
      <h3>対象（OR）</h3>
      <label><input type="checkbox" data-bit="8"> 味方単体</label>
      <label><input type="checkbox" data-bit="9"> 味方全体（前衛）</label>
      <label><input type="checkbox" data-bit="10"> 味方後衛</label>
      <label><input type="checkbox" data-bit="11"> 味方その他</label>
      <label><input type="checkbox" data-bit="12"> 敵方単体</label>
      <label><input type="checkbox" data-bit="13"> 敵方全体</label>
      <label><input type="checkbox" data-bit="14"> 敵方その他</label>
    </div>

    <div class="modal-section">
      <h3>追加条件（AND）</h3>
      <label><input type="checkbox" data-bit="6"> 先制</label>
      <label><input type="checkbox" data-bit="7"> 戦闘開始時</label>
      <label><input type="checkbox" data-bit="16"> 永続</label>
      <label><input type="checkbox" data-bit="17"> 耐性無視</label>
      <label class="zone-only"><input type="checkbox" data-bit="18"> 極ZONE</label>
      <label class="zone-only"><input type="checkbox" data-bit="19"> 絶ZONE</label>
    </div>

    <button class="confirm-btn" onclick="confirmSkillCondition()">条件追加</button>
  </div>
</div>

<div id="customTooltip" class="custom-tooltip hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="./js/app.js"></script>
</body>
</html>
